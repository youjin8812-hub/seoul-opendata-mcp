<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0e17" />
  <title>Seoul OpenData MCP · Usage Guide Presentation</title>
  <style>
    :root {
      --primary: #0066cc;
      --primary-light: #2997ff;
      --accent: #ff7057;
      --mint: #6fe3c1;
      --bg-dark: #0a0e17;
      --bg-card: #1a1f2e;
      --text-primary: #f4f0e7;
      --text-secondary: #aebdcb;
      --border: rgba(244, 240, 231, .13);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      background: radial-gradient(900px circle at 72% 28%, rgba(0,102,204,.08), transparent 44%),
                  var(--bg-dark);
    }

    .deck {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slides-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 40px;
      padding: 60px 80px;
      opacity: 0;
      visibility: hidden;
      transform: translateX(100px) scale(.95);
      transition: opacity .6s cubic-bezier(.2,.85,.2,1),
                  transform .7s cubic-bezier(.2,.85,.2,1),
                  visibility .6s;
      z-index: 1;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: none;
      z-index: 10;
    }

    .slide.prev {
      transform: translateX(-100px) scale(.95);
    }

    /* 슬라이드 헤더 */
    .slide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-light);
      box-shadow: 0 0 16px var(--primary-light);
    }

    .slide-no {
      font-variant-numeric: tabular-nums;
      color: var(--primary-light);
    }

    /* 컨텐츠 */
    .content {
      display: grid;
      align-content: center;
      min-height: 0;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 6.5vw, 96px);
      line-height: .95;
      letter-spacing: -.06em;
      font-weight: 850;
      color: var(--text-primary);
    }

    h2 {
      margin: 0 0 20px;
      font-size: clamp(36px, 4.5vw, 72px);
      line-height: 1.05;
      letter-spacing: -.05em;
      font-weight: 820;
    }

    h3 {
      margin: 0 0 12px;
      font-size: clamp(16px, 1.3vw, 22px);
      font-weight: 720;
      letter-spacing: -.03em;
    }

    .lead {
      max-width: 900px;
      margin: 0;
      font-size: clamp(16px, 1.5vw, 26px);
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .accent { color: var(--primary-light); }
    .highlight { color: var(--accent); }
    .mint { color: var(--mint); }

    /* 레이아웃 그리드 */
    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 60px;
      align-items: center;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 32px;
    }

    .feature-card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(26, 31, 46, .5);
      transition: all .4s cubic-bezier(.2,.85,.2,1);
    }

    .feature-card:hover {
      background: rgba(26, 31, 46, .8);
      border-color: rgba(41, 151, 255, .3);
      transform: translateY(-4px);
    }

    .feature-card h3 {
      color: var(--primary-light);
      margin: 0 0 10px;
    }

    .feature-card p {
      margin: 0;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .steps {
      display: grid;
      gap: 16px;
      counter-reset: step-count;
    }

    .step {
      counter-increment: step-count;
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 18px;
      align-items: flex-start;
      padding: 18px 24px;
      border-left: 3px solid var(--primary-light);
      background: rgba(26, 31, 46, .4);
      border-radius: 12px;
    }

    .step::before {
      content: counter(step-count);
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      color: var(--bg-dark);
      font-weight: 900;
      font-size: 18px;
    }

    .step-content h3 { margin: 0 0 6px; }
    .step-content p { margin: 0; font-size: 13px; color: var(--text-secondary); }

    .scenario-box {
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(41,151,255,.08), rgba(111,227,193,.04));
      min-height: 180px;
    }

    .scenario-box small {
      display: block;
      color: var(--mint);
      font-weight: 800;
      font-size: 10px;
      letter-spacing: .12em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .scenario-box strong {
      display: block;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .scenario-box span {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .checklist {
      display: grid;
      gap: 12px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(26, 31, 46, .5);
      font-size: 13px;
      line-height: 1.5;
    }

    .check-item::before {
      content: "✓";
      flex: 0 0 auto;
      color: var(--mint);
      font-weight: 900;
      font-size: 16px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
    }

    .active .reveal {
      animation: reveal .8s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .active .reveal:nth-child(1) { animation-delay: .1s; }
    .active .reveal:nth-child(2) { animation-delay: .2s; }
    .active .reveal:nth-child(3) { animation-delay: .3s; }
    .active .reveal:nth-child(4) { animation-delay: .4s; }
    .active .reveal:nth-child(5) { animation-delay: .5s; }

    @keyframes reveal {
      to { opacity: 1; transform: none; }
    }

    /* 슬라이드 하단 */
    .slide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      padding-top: 0;
      border-top: 1px solid var(--border);
    }

    /* 네비게이션 */
    .nav-controls {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(26, 31, 46, .9);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
      transform: translateX(-50%);
    }

    .nav-btn {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      transition: all .2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(41, 151, 255, .15);
      color: var(--primary-light);
    }

    .nav-btn:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .slide-counter {
      min-width: 60px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: var(--primary-light);
      font-weight: 700;
      font-size: 12px;
    }

    .dot-nav {
      position: fixed;
      right: max(24px, env(safe-area-inset-right));
      top: 50%;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(26, 31, 46, .8);
      backdrop-filter: blur(12px);
      transform: translateY(-50%);
    }

    .dot-btn {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: rgba(244, 240, 231, .2);
      cursor: pointer;
      transition: all .3s ease;
      position: relative;
    }

    .dot-btn.active {
      background: var(--primary-light);
      box-shadow: 0 0 16px var(--primary-light);
      transform: scale(1.2);
    }

    .dot-btn:hover {
      background: var(--primary-light);
    }

    /* 타이틀 슬라이드 */
    .title-slide h1 {
      font-size: clamp(72px, 9vw, 132px);
      margin-bottom: 24px;
    }

    .title-slide .lead {
      font-size: clamp(18px, 2vw, 32px);
      max-width: 800px;
    }

    .constellation {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .orbit-ring {
      position: absolute;
      border: 1px solid rgba(41, 151, 255, .2);
      border-radius: 50%;
      animation: spin 24s linear infinite;
    }

    .orbit-ring:nth-child(1) { inset: 10%; }
    .orbit-ring:nth-child(2) { inset: 30%; border-style: dashed; }
    .orbit-ring:nth-child(3) { inset: 50%; opacity: .5; }

    .orbit-core {
      position: relative;
      z-index: 2;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 30%, rgba(41,151,255,.4), var(--primary));
      box-shadow: 0 0 60px rgba(41, 151, 255, .3), inset 0 0 30px rgba(255,255,255,.1);
      font-weight: 900;
      font-size: 28px;
    }

    .orbit-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary-light);
      box-shadow: 0 0 20px var(--primary-light);
    }

    .orbit-dot:nth-child(4) { top: 8%; left: 45%; }
    .orbit-dot:nth-child(5) { top: 35%; right: 5%; }
    .orbit-dot:nth-child(6) { bottom: 12%; right: 30%; }
    .orbit-dot:nth-child(7) { bottom: 5%; left: 20%; }
    .orbit-dot:nth-child(8) { top: 20%; left: 3%; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* 반응형 */
    @media (max-width: 1200px) {
      .slide { padding: 50px 60px; gap: 30px; }
      .hero-grid { grid-template-columns: 1fr; }
      .dot-nav { display: none; }
    }

    @media (max-width: 768px) {
      .slide { padding: 40px 32px; gap: 24px; }
      h1 { font-size: clamp(36px, 5vw, 64px); }
      h2 { font-size: clamp(28px, 3.5vw, 48px); }
      .feature-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    class Presentation {
      constructor() {
        this.currentSlide = 0;
        this.totalSlides = slides.length;
        this.init();
      }

      init() {
        this.render();
        this.setupEventListeners();
        this.updateUI();
      }

      render() {
        const container = document.getElementById('slidesContainer');
        container.innerHTML = slides.map((slide, idx) => `
          <section class="slide ${idx === 0 ? 'active' : ''}" data-index="${idx}">
            <div class="slide-header">
              <div class="brand">
                <span class="brand-dot"></span>
                <span>Seoul OpenData MCP</span>
              </div>
              <span class="slide-no">${String(idx + 1).padStart(2, '0')}</span>
            </div>
            <div class="content">
              ${slide.content || `
                <h2>${slide.title}</h2>
                <p class="lead">${slide.subtitle || ''}</p>
              `}
            </div>
            <div class="slide-footer">
              <span>${slide.title || 'Slide'}</span>
              <span>5분 발표자료 · Seoul OpenData MCP</span>
            </div>
          </section>
        `).join('');

        this.renderDotNav();
      }

      renderDotNav() {
        const dotNav = document.getElementById('dotNav');
        dotNav.innerHTML = slides.map((_, idx) => `
          <button class="dot-btn ${idx === 0 ? 'active' : ''}" data-index="${idx}" aria-label="Slide ${idx + 1}"></button>
        `).join('');

        dotNav.querySelectorAll('.dot-btn').forEach(btn => {
          btn.addEventListener('click', () => this.goToSlide(parseInt(btn.dataset.index)));
        });
      }

      goToSlide(index) {
        if (index < 0 || index >= this.totalSlides) return;

        const slides = document.querySelectorAll('.slide');
        slides.forEach((slide, idx) => {
          slide.classList.remove('active', 'prev');
          if (idx === index) {
            slide.classList.add('active');
          } else if (idx < index) {
            slide.classList.add('prev');
          }
        });

        document.querySelectorAll('.dot-btn').forEach((btn, idx) => {
          btn.classList.toggle('active', idx === index);
        });

        this.currentSlide = index;
        this.updateUI();
      }

      updateUI() {
        document.getElementById('currentSlide').textContent = String(this.currentSlide + 1).padStart(2, '0');
        document.getElementById('prevBtn').disabled = this.currentSlide === 0;
        document.getElementById('nextBtn').disabled = this.currentSlide === this.totalSlides - 1;
      }

      setupEventListeners() {
        document.getElementById('prevBtn').addEventListener('click', () => {
          this.goToSlide(this.currentSlide - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
          this.goToSlide(this.currentSlide + 1);
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            this.goToSlide(this.currentSlide - 1);
          } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
            e.preventDefault();
            this.goToSlide(this.currentSlide + 1);
          } else if (e.key === 'Home') {
            this.goToSlide(0);
          } else if (e.key === 'End') {
            this.goToSlide(this.totalSlides - 1);
          }
        });
      }
    }

    new Presentation();
  </script>
